# vim: ft=tmux

# Disable prefix timeout
set-option -g prefix-timeout 0

# Order sessions in picker by name
bind-key -T prefix s choose-tree -sOname

# Vim-style copy mode navigation
set-option -g mode-keys vi

# Set terminal with proper colors
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",xterm-256color:RGB"

# Reload config
bind-key r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Fix Vim ESC delay
set-option -sg escape-time 0

# Increase scrollback buffer
set-option -g history-limit 100000

# Enable mouse support
set-option -g mouse on

# Append jay done
bind-key J send-keys C-z "fg; jay done" Enter

# Use favorite window arrangement
unbind-key Space
bind-key Space split-window \; select-layout main-vertical \; swap-pane -U

# Nice status line
set-option -g status-left-length 30
set-option -g status-right " #H | %I:%M %m/%d "
set-option -g status-left "#[fg=colour255,bg=colour20] #S #[bg=colour255] "
set-option -g status-style fg=colour20,bg=colour255
set-option -g pane-active-border-style fg=colour20

# Enable focus events for Vim autoread
set-option -g focus-events on
