# vim: ft=tmux

bind-key -T prefix s choose-tree -sOname

set-option -g mode-keys vi

set-option -sg default-terminal "tmux-256color"

unbind-key C-b
set-option -g prefix C-z

bind-key z send-keys C-z
bind-key C-z last-window

bind-key R source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -sg escape-time 0

# scrollback buffer size increase
set-option -g history-limit 100000

# Copy/paste interop
bind-key C-c run-shell "tmux show-buffer | reattach-to-user-namespace pbcopy"
bind-key C-v run-shell "reattach-to-user-namespace pbpaste | tmux load-buffer - && tmux paste-buffer"

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe 'reattach-to-user-namespace pbcopy' \; send-keys -X clear-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

set-option -g mouse on
bind-key -T root WheelUpPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind-key -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"
bind-key -T copy-mode-vi WheelUpPane send-keys -X halfpage-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X halfpage-down

bind-key J send-keys C-z "fg; jay done" Enter

unbind-key Space
bind-key Space split-window \; select-layout main-vertical \; swap-pane -U

# status line
set-option -g status-left-length 30
set-option -g status-right " #H | %I:%M %m/%d "

set-option -g status-left "#[fg=colour255,bg=colour20] #S #[bg=colour255] "
set-option -g status-style fg=colour20,bg=colour255
set-option -g pane-active-border-style fg=colour20
